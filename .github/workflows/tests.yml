name: tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false # each platform's result is wanted even when another fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # OpenCV and Qt load these at import time; the Linux runner image does not ship them.
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Python 3.12 comes from requires-python; --locked fails if uv.lock is out of date.
      - name: Install dependencies
        run: uv sync --locked

      # What this platform offers: displays, input control, models. Fails if a core part is broken.
      - name: Platform report
        run: uv run superhero doctor

      # The suite needs no camera, microphone, display or model download.
      - name: Test
        run: uv run pytest

  package:
    name: package (${{ matrix.os }})
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build bundle
        run: uv run --locked --group package python packaging/build.py

      # The bundle must start and import its heavy dependencies outside the dev environment,
      # and carry the licences of what it redistributes (the build warns about any gap).
      - name: Smoke-test the bundle
        shell: bash
        run: |
          ./dist/superhero/superhero doctor
          test -s dist/superhero/THIRD_PARTY_NOTICES.txt
          test -s dist/superhero/licenses/common/LGPL-3.0.txt

      - uses: actions/upload-artifact@v4
        with:
          name: superhero-${{ runner.os }}-${{ runner.arch }}
          path: dist/superhero*
          retention-days: 14
